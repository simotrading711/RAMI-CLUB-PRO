
name: Build RAMI CLUB PRO APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -o RAMI_CLUB_PRO_ANDROID.zip -d extracted
          echo "Project files:"
          find extracted -maxdepth 4 -type f

      - name: Locate project
        run: |
          PROJECT=$(find extracted -name settings.gradle -type f | head -n 1 | xargs dirname)
          echo "PROJECT_DIR=$PROJECT" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RAMI-CLUB-PRO-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          
